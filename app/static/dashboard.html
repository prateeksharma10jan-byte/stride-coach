<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>stride-coach dashboard</title>
<style>
:root{--bg:#fff;--fg:#1c1f24;--card:#f4f5f7;--mut:#6b7280;--acc:#fc4c02;--blue:#339af0}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--fg:#e8eaed;--card:#1d2127;--mut:#9aa0a6}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;padding:16px;max-width:900px;margin:auto}
h1{font-size:20px}h2{font-size:14px;color:var(--mut);margin:0 0 8px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border-radius:12px;padding:14px}
svg{width:100%;height:auto;display:block}text{fill:var(--mut);font-size:10px}
ul{margin:0;padding-left:18px}li{margin:3px 0}.big{font-size:28px;font-weight:700}
</style></head><body>
<h1>Training dashboard</h1><div id="msg"></div><div class="grid" id="g"></div>
<script>
const NS="http://www.w3.org/2000/svg";
const Z=["#6c8ebf","#4dabf7","#51cf66","#fcc419","#ff6b6b"];
function s(tag,a={},t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;return e}
function h(tag,t,cls){const e=document.createElement(tag);if(t!=null)e.textContent=t;if(cls)e.className=cls;return e}
function card(title){const c=h("div",null,"card");c.append(h("h2",title));document.getElementById("g").append(c);return c}
function bars(c,labels,vals,color){const W=320,H=140,m=Math.max(...vals,1),sv=s("svg",{viewBox:`0 0 ${W} ${H}`});
 const bw=W/labels.length;vals.forEach((v,i)=>{const bh=(H-30)*v/m;sv.append(s("rect",{x:i*bw+4,y:H-18-bh,width:bw-8,height:bh,fill:color,rx:2}));
 sv.append(s("text",{x:i*bw+bw/2,y:H-5,"text-anchor":"middle"},labels[i]))});c.append(sv)}
function line(c,pts){if(pts.length<2){c.append(h("p","Not enough data yet."));return}
 const W=320,H=140,ys=pts.map(p=>p.e1rm),lo=Math.min(...ys),hi=Math.max(...ys),r=(hi-lo)||1,sv=s("svg",{viewBox:`0 0 ${W} ${H}`});
 const d=pts.map((p,i)=>`${i?"L":"M"}${10+i*(W-20)/(pts.length-1)},${H-20-(H-40)*(p.e1rm-lo)/r}`).join("");
 sv.append(s("path",{d,fill:"none",stroke:"var(--acc)","stroke-width":2}));
 sv.append(s("text",{x:4,y:12},hi+" kg"));sv.append(s("text",{x:4,y:H-6},lo+" kg"));c.append(sv)}
function hbars(c,rows){rows.forEach(([n,v],_,a)=>{const m=Math.max(...a.map(x=>x[1]),1),r=h("div");r.style.cssText="display:flex;align-items:center;gap:8px;margin:4px 0";
 const l=h("span",n);l.style.cssText="width:120px;font-size:12px";const b=h("div");b.style.cssText=`height:12px;border-radius:3px;background:var(--acc);width:${100*v/m}%`;
 r.append(l,b,h("span",String(v)));c.append(r)})}
(async()=>{
 const t=new URLSearchParams(location.search).get("t");
 const r=await fetch("/api/dashboard?t="+encodeURIComponent(t||""));
 if(!r.ok){document.getElementById("msg").textContent="Link expired or invalid. Send /dashboard to the bot for a new one.";return}
 const d=await r.json(), wk=d.weekly;
 let c=card("Load ratio (ACWR)");c.append(h("div",d.acwr==null?"-":String(d.acwr),"big"),h("div",d.acwr_label));
 c=card("Weekly running km");bars(c,wk.map(w=>w.label),wk.map(w=>w.km),"var(--acc)");
 c=card("Weekly training load (TRIMP)");bars(c,wk.map(w=>w.label),wk.map(w=>w.trimp),"var(--blue)");
 c=card("Weekly lifting volume (kg)");bars(c,wk.map(w=>w.label),wk.map(w=>w.volume_kg),"#51cf66");
 for(const [ex,pts] of Object.entries(d.e1rm_series)){c=card("e1RM - "+ex);line(c,pts)}
 if(d.zone_trend.length){c=card("Zone mix, last runs");const W=320,H=140,sv=s("svg",{viewBox:`0 0 ${W} ${H}`}),bw=W/d.zone_trend.length;
  d.zone_trend.forEach((z,i)=>{let y=H-18;["Z1","Z2","Z3","Z4","Z5"].forEach((k,j)=>{const bh=(H-30)*(z[k]||0)/100;y-=bh;sv.append(s("rect",{x:i*bw+3,y,width:bw-6,height:bh,fill:Z[j]}))});
  sv.append(s("text",{x:i*bw+bw/2,y:H-5,"text-anchor":"middle"},z.date.slice(5)))});c.append(sv)}
 if(Object.keys(d.muscle_sets).length){c=card("Sets per muscle (7 days)");hbars(c,Object.entries(d.muscle_sets))}
 if(d.prs.length){c=card("Best e1RM");const u=h("ul");d.prs.forEach(p=>u.append(h("li",p.exercise+": "+p.e1rm_kg+" kg")));c.append(u)}
 c=card("Recent");const u=h("ul");d.recent.forEach(a=>u.append(h("li",a.date+" - "+a.name)));c.append(u);
})();
</script></body></html>
